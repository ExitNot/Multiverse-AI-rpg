[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multiverse-ai-rpg"
version = "0.1.0"
description = "Multiverse AI RPG Project"
requires-python = ">=3.8"
dependencies = [
    "pydantic>=2.11.4",
    "python-telegram-bot>=22.0",
    "pinecone>=5.4.2",
    "supabase>=2.6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.1",
    "transformers>=4.49.0"
]

[project.optional-dependencies]
dev = [
    "pipreqs>=0.4.13",
    "virtualenv>=20.29.2"
]

[tool.setuptools]
packages = [
    "db",
    "game",
    "logs",
    "domain",
    "clients",
    "locales",
    "services",
    "persistence"
] 